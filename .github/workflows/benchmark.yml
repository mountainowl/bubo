name: Benchmark

# Runs the review benchmark on a schedule (and on demand / when the suite
# changes) as a regression check. The replay run scores the committed sample
# outputs against the labeled corpus — no API key needed. A live bubo run (and
# competitor captures) feed the same scorer; see benchmarks/README.md.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "benchmarks/**"

permissions:
  contents: read

jobs:
  benchmark:
    name: Score the corpus (replay)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Test the scorer
        run: uv run pytest -q benchmarks/test_score.py

      - name: Run the benchmark (replay)
        run: uv run python benchmarks/run.py

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bubo-benchmark-report
          path: |
            benchmarks/report.md
            benchmarks/report.json
          if-no-files-found: error
