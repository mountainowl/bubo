name: Release

# Cut a release when a version tag is pushed. Builds the sdist + wheel,
# generates a software bill of materials (SBOM), and publishes both as
# GitHub release assets. The SBOM gives downstream consumers a verifiable
# dependency inventory and is one of the supply-chain artifacts OpenSSF
# Scorecard looks for.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
      id-token: write # required for cosign keyless signing via Sigstore OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Build deploy bundle
        # The sdist contains only the Python package (uv_build default
        # behaviour). The deploy bundle ships the full operator-facing
        # tree — bin/ wrappers, prompts, deploy templates, the example
        # config — none of which the sdist carries, as one signed
        # bubo-deploy-X.Y.Z.tar.gz artifact per release. The exclude
        # pattern drops runtime noise (venv, caches, local var/ state,
        # operator config).
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar \
            --exclude=.venv \
            --exclude=.git \
            --exclude=.pytest_cache \
            --exclude=__pycache__ \
            --exclude=config/env.toml \
            --exclude=var/state \
            --exclude=var/work \
            --exclude=var/log \
            --exclude=var/reports \
            --exclude=var/jobs \
            --exclude=./dist \
            --transform "s,^\./,bubo-${version}/," \
            -czf "dist/bubo-deploy-${version}.tar.gz" .
          ls -la "dist/bubo-deploy-${version}.tar.gz"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Scan the source tree so syft picks up uv.lock + pyproject.toml
          # and records the full locked dependency set.
          path: .
          format: spdx-json
          artifact-name: bubo-sbom.spdx.json
          output-file: dist/bubo-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with cosign
        # Keyless signing via Sigstore + GitHub OIDC. Produces a single
        # Sigstore .bundle per artifact (wheel, sdist, deploy bundle,
        # SBOM) — the bundle carries both the signature and the signing
        # certificate. cosign v3 (installed by cosign-installer) writes
        # the new bundle format and explicitly IGNORES the legacy
        # --output-signature / --output-certificate flags ("deprecated
        # when using --new-bundle-format and will be ignored"), so we
        # don't pass them — doing so produced no .sig/.pem and broke the
        # publish step's glob. Verify with:
        #   cosign verify-blob --bundle <artifact>.bundle \
        #     --certificate-identity-regexp '…' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     <artifact>
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/bubo-sbom.spdx.json; do
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/bubo-sbom.spdx.json
            dist/*.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true
