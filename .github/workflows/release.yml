name: Release

# Cut a release when a version tag is pushed. Builds the sdist + wheel,
# generates a software bill of materials (SBOM), and publishes both as
# GitHub release assets. The SBOM gives downstream consumers a verifiable
# dependency inventory and is one of the supply-chain artifacts OpenSSF
# Scorecard looks for.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
      id-token: write # required for cosign keyless signing via Sigstore OIDC
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Build deploy bundle
        # The sdist contains only the Python package (uv_build default
        # behaviour). Operators deploying via scripts/install-package.sh
        # need the full tree — wrapper scripts, prompts, deploy templates,
        # the example config — none of which the sdist carries.
        # llm-reviewer-deploy-X.Y.Z.tar.gz is the artifact operators
        # should download for the install script. Exclude pattern mirrors
        # scripts/deploy-package.sh exactly so the published bundle and
        # an ad-hoc `deploy-package.sh user@host` ship the same bytes.
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar \
            --exclude=.venv \
            --exclude=.git \
            --exclude=.pytest_cache \
            --exclude=__pycache__ \
            --exclude=config/env.toml \
            --exclude=var/state \
            --exclude=var/work \
            --exclude=var/log \
            --exclude=var/reports \
            --exclude=var/jobs \
            --exclude=./dist \
            --transform "s,^\./,llm-reviewer-${version}/," \
            -czf "dist/llm-reviewer-deploy-${version}.tar.gz" .
          ls -la "dist/llm-reviewer-deploy-${version}.tar.gz"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Scan the source tree so syft picks up uv.lock + pyproject.toml
          # and records the full locked dependency set.
          path: .
          format: spdx-json
          artifact-name: llm-reviewer-sbom.spdx.json
          output-file: dist/llm-reviewer-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with cosign
        # Keyless signing via Sigstore + GitHub OIDC. Produces .sig + .pem
        # for each artifact (wheel, sdist, deploy bundle, SBOM) so
        # downstream consumers can verify provenance with `cosign
        # verify-blob` and the repo's workflow identity. The glob pulls
        # in *.tar.gz, which covers both the sdist and the deploy bundle.
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/llm-reviewer-sbom.spdx.json; do
            cosign sign-blob --yes \
              --output-signature "${artifact}.sig" \
              --output-certificate "${artifact}.pem" \
              "${artifact}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/llm-reviewer-sbom.spdx.json
            dist/*.sig
            dist/*.pem
          generate_release_notes: true
          fail_on_unmatched_files: true
