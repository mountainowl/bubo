name: Release

# Cut a release when a version tag is pushed. Builds the sdist + wheel,
# generates a software bill of materials (SBOM), and publishes both as
# GitHub release assets. The SBOM gives downstream consumers a verifiable
# dependency inventory and is one of the supply-chain artifacts OpenSSF
# Scorecard looks for.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    name: Build, SBOM, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub release
      id-token: write # required for cosign keyless signing via Sigstore OIDC
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }} # SLSA subjects for the provenance job
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: Build sdist and wheel
        run: uv build

      - name: Build deploy bundle
        # The sdist contains only the Python package (uv_build default
        # behaviour). The deploy bundle ships the full operator-facing
        # tree — bin/ wrappers, prompts, deploy templates, the example
        # config — none of which the sdist carries, as one signed
        # bubo-deploy-X.Y.Z.tar.gz artifact per release. The exclude
        # pattern drops runtime noise (venv, caches, local var/ state,
        # operator config).
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          COPYFILE_DISABLE=1 tar \
            --exclude=.venv \
            --exclude=.git \
            --exclude=.pytest_cache \
            --exclude=__pycache__ \
            --exclude=config/env.toml \
            --exclude=var/state \
            --exclude=var/work \
            --exclude=var/log \
            --exclude=var/reports \
            --exclude=var/jobs \
            --exclude=./dist \
            --transform "s,^\./,bubo-${version}/," \
            -czf "dist/bubo-deploy-${version}.tar.gz" .
          ls -la "dist/bubo-deploy-${version}.tar.gz"

      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Scan the source tree so syft picks up uv.lock + pyproject.toml
          # and records the full locked dependency set.
          path: .
          format: spdx-json
          artifact-name: bubo-sbom.spdx.json
          output-file: dist/bubo-sbom.spdx.json

      - name: Compute artifact digests (SLSA subjects)
        id: hash
        # Base64-encoded `sha256sum` of the published distributables (wheel,
        # sdist, deploy bundle, SBOM) — the subjects the SLSA generator
        # attests. Computed after every artifact exists but before cosign,
        # since the .bundle files are signatures, not release distributables.
        run: |
          cd dist
          echo "hashes=$(sha256sum *.whl *.tar.gz bubo-sbom.spdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artifacts with cosign
        # Keyless signing via Sigstore + GitHub OIDC. Produces a single
        # Sigstore .bundle per artifact (wheel, sdist, deploy bundle,
        # SBOM) — the bundle carries both the signature and the signing
        # certificate. cosign v3 (installed by cosign-installer) writes
        # the new bundle format and explicitly IGNORES the legacy
        # --output-signature / --output-certificate flags ("deprecated
        # when using --new-bundle-format and will be ignored"), so we
        # don't pass them — doing so produced no .sig/.pem and broke the
        # publish step's glob. Verify with:
        #   cosign verify-blob --bundle <artifact>.bundle \
        #     --certificate-identity-regexp '…' \
        #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     <artifact>
        run: |
          for artifact in dist/*.whl dist/*.tar.gz dist/bubo-sbom.spdx.json; do
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/bubo-sbom.spdx.json
            dist/*.bundle
          generate_release_notes: true
          fail_on_unmatched_files: true

  # SLSA Build Level 3 provenance for the released artifacts. The generator
  # runs as an isolated, trusted reusable workflow — that isolation (the build
  # cannot be tampered with by this repo's own workflow) is what earns L3. It
  # signs an in-toto provenance attestation keylessly via Sigstore and attaches
  # the .intoto.jsonl to the release. Verify with:
  #   slsa-verifier verify-artifact <artifact> \
  #     --provenance-path <artifact>.intoto.jsonl \
  #     --source-uri github.com/mountainowl/bubo
  provenance:
    name: SLSA provenance (Build L3)
    needs: [release]
    permissions:
      actions: read # read the workflow run metadata recorded in the provenance
      id-token: write # mint the OIDC token for keyless provenance signing
      contents: write # attach the provenance attestation to the GitHub release
    # MUST be a semantic-version tag, NOT a commit SHA: the generator reads its
    # own ref to assert the trusted-builder identity, so a SHA pin breaks it.
    # This is the documented exception to the repo's hash-pinning convention.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true # attach the .intoto.jsonl provenance to the release
