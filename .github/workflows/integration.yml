name: Integration (live SCM)

# Read-only integration tests against real GitLab and GitHub instances. They
# catch API-shape drift that fixture-based unit tests miss. Runs nightly and
# on demand; never on pull requests (no secret exposure to forks). The job
# no-ops cleanly when neither provider's token secret is configured, so
# enabling either one is purely additive. Per-test skips (see the live test
# modules) keep the run green when only one provider's creds are present.

on:
  schedule:
    - cron: "0 6 * * *" # nightly, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Live GitLab + GitHub read-only tests
    runs-on: ubuntu-latest
    # Skip on forks — they have no access to the secrets anyway.
    if: ${{ github.repository == 'mountainowl/bubo' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run live integration tests
        env:
          BUBO_IT_GITLAB_TOKEN: ${{ secrets.IT_GITLAB_TOKEN }}
          BUBO_IT_GITLAB_PROJECT: ${{ vars.IT_GITLAB_PROJECT }}
          BUBO_IT_GITLAB_URL: ${{ vars.IT_GITLAB_URL }}
          BUBO_IT_GITHUB_TOKEN: ${{ secrets.IT_GITHUB_TOKEN }}
          BUBO_IT_GITHUB_PROJECT: ${{ vars.IT_GITHUB_PROJECT }}
          BUBO_IT_GITHUB_API_URL: ${{ vars.IT_GITHUB_API_URL }}
        run: |
          if [ -z "${BUBO_IT_GITLAB_TOKEN}" ] && [ -z "${BUBO_IT_GITHUB_TOKEN}" ]; then
            echo "Neither IT_GITLAB_TOKEN nor IT_GITHUB_TOKEN configured — skipping live tests."
            exit 0
          fi
          uv run pytest -m integration -v
