name: Release-please lockfile sync

# When release-please opens or updates its release PR, regenerate uv.lock
# so the version bump in pyproject.toml stays in sync with the locked
# bubo self-entry. Without this, every release PR ships with a
# stale lock — `uv sync --locked` fails in CI and again on every operator
# install — and admin-merging the failing PR ships a broken tarball.
#
# Triggers only on the release-please branch name pattern so feature
# PRs are unaffected. The push back to the PR branch uses RELEASE_PAT
# (the same secret release-please-action itself uses) so a fresh CI run
# fires on the lockfile commit and the operator sees a green PR before
# merging.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  sync-lock:
    name: Regenerate uv.lock on release PRs
    if: startsWith(github.head_ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR branch with PAT
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Use the PAT so the subsequent push triggers a fresh CI run
          # — the default GITHUB_TOKEN's push does not re-fire workflows.
          token: ${{ secrets.RELEASE_PAT }}
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit and push if changed
        # Commit identity is the repo owner, NOT release-please[bot]. When
        # the release PR is later squash-merged, GitHub auto-attaches a
        # `Co-authored-by:` trailer for each distinct identity on the
        # branch — committing as the bot promotes the bot into the
        # repo's Contributors widget. Using the owner's noreply email
        # keeps the squashed merge attributed entirely to a single
        # human identity. The PAT-driven push still triggers a fresh CI
        # run (the default GITHUB_TOKEN does not).
        run: |
          if git diff --quiet uv.lock; then
            echo "uv.lock already in sync with pyproject.toml — no commit"
            exit 0
          fi
          git config user.name "mountainowl"
          git config user.email "mountainowl@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release-please): regenerate uv.lock for new version"
          git push
