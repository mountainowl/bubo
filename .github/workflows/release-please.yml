name: Release Please

# Automated release-PR maintainer.
#
# On every push to `main`, release-please either opens a new release PR or
# updates the existing one with the next computed version from Conventional
# Commits since the last tag:
#
#   * `fix:`                              -> patch
#   * `feat:`                             -> minor
#   * `feat!:` / `BREAKING CHANGE:`       -> minor (pre-1.0 via bump-minor-pre-major)
#   * `chore:` / `docs:` / `test:` / ...  -> no bump
#
# Merging the release PR creates a `vX.Y.Z` tag, which fires `release.yml`
# (build sdist+wheel, generate SBOM, cosign-sign, publish GitHub Release).
#
# CHANGELOG.md is intentionally NOT managed by release-please — entries are
# hand-curated under `## [Unreleased]` and renamed at release time. The
# `.release-please-changelog.md` sink absorbs release-please's
# auto-generated changelog so the human one stays clean.
#
# Setup prerequisite: a `RELEASE_PAT` repository secret holding a Personal
# Access Token (or GitHub App installation token) with `contents: write`
# and `pull-requests: write`. The default `GITHUB_TOKEN` cannot trigger
# downstream workflows on tag push (GitHub anti-recursion safeguard), so
# `release.yml` would silently fail to fire without the PAT.

on:
  # Re-enabled after a manual re-bootstrap. release-please had diverged —
  # it only recognized tags it created itself (last: v0.7.0) and kept
  # proposing/reverting "release 0.7.1" PRs after the manual v0.7.1/v0.7.2
  # cuts. The state is now realigned: `.release-please-manifest.json` is
  # `0.8.0` and a real `v0.8.0` tag + release exist, so release-please
  # anchors at 0.8.0 and computes the next version from commits after it.
  # workflow_dispatch is kept so a release can also be forced by hand.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Maintain release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create release branch, write commits and tags
      pull-requests: write  # open / update the release PR
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PAT }}
