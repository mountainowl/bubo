[history]
persistence = "none"
max_bytes = 1048576

[features]
shell_snapshot = true
unified_exec = true
skill_mcp_dependency_install = false
memories = false
apps = false
plugins = false
hooks = false

[shell_environment_policy]
inherit = "core"

# Optional interactive Codex profile. The hardened review runner ignores user
# config and generates read-only policy from ReviewConfig; only auth is copied.
# The `bubo` profile lives in its own file, ~/.codex/bubo.config.toml (written
# by `bubo init` from codex-bubo.config.toml). Codex >= 0.134.0 refuses
# `--profile bubo` while this file still carries a legacy [profiles.bubo]
# table, so keep it out of here. Custom LLM_BASE_URL endpoints must implement
# Responses, not only Chat Completions.

{{MODEL_PROVIDER_BLOCK}}
