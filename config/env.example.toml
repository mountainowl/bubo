# ============================================================================
# bubo runtime configuration
# ============================================================================
#
# This is the TEMPLATE. Copy it to `config/env.toml` and edit there:
#
#     cp config/env.example.toml config/env.toml
#
# `config/env.toml` is gitignored and is the only file that holds tokens. Do
# not commit real values. `bubo init` preserves your `config/env.toml`
# across upgrades — it never overwrites it unless you pass `--force`.
#
# Conventions used in this file:
#
#   * Keys are loaded by `src/bubo/review_config.py` and
#     `src/bubo/env_config.py`. The Python dataclass field names may
#     differ slightly from the TOML keys; the TOML key is the authoritative
#     name for operators.
#   * Every section/key has a comment block explaining: what it does, when to
#     change it, the safe default, and any known footguns.
#   * Values shown below are the defaults the code falls back to when a key
#     is missing — leaving a key out is equivalent to setting it to the value
#     shown here.
#
# Environment-variable interpolation:
#
#   Any string value can reference environment variables using POSIX-style
#   placeholders. This keeps secrets OUT of the on-disk config:
#
#       token       = "${GITLAB_TOKEN}"                # required; fails fast if unset
#       url         = "${GITLAB_URL:-https://gitlab.com}"   # default if unset
#       llm_api_key = "${LLM_API_KEY:-}"               # explicitly optional
#
#   Use a literal `$` by escaping it as `$$`. Interpolation runs at TOML
#   load time so the rest of the runtime sees the resolved value — no
#   special handling needed in downstream code.
#
#   Recommended pairing: systemd `LoadCredential=` (see
#   deploy/templates/bubo.service) so the actual token lives in
#   /etc/bubo/credentials/ with mode 0400 and never touches your
#   git history.
# ============================================================================


# ----------------------------------------------------------------------------
# [scm] — Which source-control provider to review.
# ----------------------------------------------------------------------------
[scm]

# Provider to poll: "gitlab" (default) or "github". The same projects list,
# caps, and policy filters apply either way. `bubo-poller` reviews
# whatever is set here; `BUBO_PROVIDER=github` overrides it for a single run
# (handy for a host that reviews both, each on its own cron entry).
provider = "gitlab"


# ----------------------------------------------------------------------------
# [gitlab] — GitLab connection (used when provider = "gitlab").
# ----------------------------------------------------------------------------
[gitlab]

# GitLab web URL the poller reads MRs from.
#
# Change only for self-hosted GitLab installs (for example,
# "https://gitlab.mycorp.example"). For self-hosted hosts, keep `api_url`
# pointed at the same host or the in-agent MCP tools will read MRs from a
# different server than the poller posts to.
url = "https://gitlab.com"

# GitLab REST API endpoint used by the GitLab MCP server inside the review
# agent. Usually `<url>/api/v4`. Override only when the API lives on a
# different hostname or path (rare in self-hosted setups).
api_url = "https://gitlab.com/api/v4"

# GitLab username of the bot account whose name appears on posted review
# threads. Outcome sync uses this to tell bot comments apart from developer
# replies — set it to whatever account you created the token under.
bot_username = "bubo"

# Safety fence applied INSIDE the review agent: GitLab MCP tools whose names
# match this regex are blocked even if the prompt or MCP server exposes
# them. The default blocks anything that could delete or merge an MR or push
# files. Tighten if you trust the agent less; loosen at your own risk.
denied_tools_regex = "^(delete_.*|merge_merge_request|push_files)$"

# GitLab personal-access token, `api` scope required.
#
# The same value is exported to the runtime environment under three names so
# different tools can pick it up: `GITLAB_TOKEN`, `GITLAB_PERSONAL_ACCESS_TOKEN`
# (used by GitLab MCP), and `GLAB_TOKEN` (used by the `glab` CLI).
#
# Leave blank for the example template. **Do not commit real values.**
token = ""


# ----------------------------------------------------------------------------
# [github] — GitHub connection (used when provider = "github").
# ----------------------------------------------------------------------------
#
# Required prerequisites for the GitHub provider: the `gh` CLI (checkout) and
# a GitHub MCP server on PATH as `github-mcp-server` / `mcp-github` /
# `gh-mcp-server` (inline review-comment posting; falls back to REST if the
# MCP tool name does not match).
[github]

# REST API base. Use https://api.github.com for github.com, or
# https://<host>/api/v3 for GitHub Enterprise Server.
api_url = "https://api.github.com"

# GitHub username of the bot account whose name appears on review comments.
# Outcome sync uses this to separate bot comments from developer replies.
bot_username = "bubo"

# GitHub token (fine-grained or classic) with pull-request read + write
# scope. Exported as GITHUB_TOKEN, GITHUB_PERSONAL_ACCESS_TOKEN (GitHub MCP),
# and GH_TOKEN (the `gh` CLI). Leave blank in the template.
token = ""


# ----------------------------------------------------------------------------
# [review] — How the poller picks, paces, and filters reviews.
# ----------------------------------------------------------------------------
[review]

# When `true`, the poller plans findings and stores them in SQLite but DOES
# NOT post any GitLab comments. Recommended starting value for every fresh
# install or model/prompt change — keep it on until you have eyeballed
# several real review outputs and you are happy with them. Flip to `false`
# to start posting.
dry_run = true

# Maximum merge requests queued by a single poll cycle.
#
# Each queued MR is processed in a forked worker; higher values increase
# throughput but also raise concurrent load on GitLab, your LLM provider,
# and (with `dry_run = false`) the inline-comment surface developers see.
# Start small and raise once you have outcome metrics.
max_merge_requests_per_poll = 8

# Maximum findings accepted from a single merge-request review.
#
# This number is BOTH applied to parsed findings AND substituted into the
# meta prompt as `{{MAX_FINDINGS_PER_REVIEW}}`, so the agent itself stops
# generating further findings once the cap is hit. Reduces noise; tune up
# only if you find genuine high-quality findings are being truncated.
max_findings_per_merge_request = 8

# Per-MR worker timeout in seconds. After this elapses, the worker
# subprocess (including any LLM child processes) is killed and the MR is
# recorded as `failed`. Raise for very large MRs or high-reasoning-effort
# models; lower for tighter SLAs.
timeout_seconds = 1800

# Minimum LLM confidence score (0.0–1.0) required to POST a finding.
#
# The review prompt asks the agent to emit a numeric `confidence` field per
# finding ("how sure are you?"). Findings strictly below this threshold are
# dropped before posting/planning — they appear in the agent transcript and
# in the `finding_filtered` log event but never reach GitLab and never get
# stored in `review_findings`.
#
# Why 0.85: matches the bot's stated bias toward high-precision feedback —
# fewer false positives, even at the cost of missing some real issues. Set
# lower (e.g. 0.70) if you want to see more borderline findings during
# tuning, or 0.0 to disable the filter entirely.
#
# Inclusive on the high side: 0.85 accepts a finding scored exactly 0.85.
min_confidence = 0.85

# Per-category confidence floors (the calibrated-confidence lever, OFF by
# default). `min_confidence` above applies one bar to every finding, but a
# self-reported 0.9 means very different things for a correctness claim vs a
# style nit (weak models are reliably overconfident on trivia). This table sets
# a HIGHER bar for noise-prone canonical categories — a floor only ever RAISES
# the bar, never lowers it. Keys must be canonical categories (correctness,
# security, concurrency, resource, error_handling, performance, style, docs,
# test, design, naming, other); an unknown key is a config error. A finding that
# clears `min_confidence` but fails its category floor is logged as
# `confidence_below_category_floor`. Uncomment to use (inline table — keep it a
# single `[review]` key so it can't accidentally swallow the keys below it):
#
#   category_min_confidence = { style = 0.95, design = 0.95, performance = 0.92 }

# Auto-calibrate those floors from THIS repo's accept/dispute history (OFF by
# default). When true, a category the team disputes more earns a higher floor —
# linearly from `min_confidence` (0% disputed) to `calibrate_max_confidence`
# (100% disputed), once a category has at least `dispute_suppress_min_samples`
# resolved outcomes. Aggregated on the CANONICAL category (so test/testing/
# test-coverage combine into one signal); manual `category_min_confidence`
# entries win over a derived floor. Self-reinforcing like dispute suppression
# (see docs/configuration.md), but gentler — it only raises the confidence bar,
# it never silences a class.
calibrate_confidence = false

# Ceiling for a calibrated floor (only consulted when calibrate_confidence =
# true). Kept below 1.0 so even a fully-disputed class still admits a
# sufficiently confident finding rather than becoming an impossible bar.
calibrate_max_confidence = 0.97

# Whitelist of finding kinds to post. A finding is kept if AT LEAST ONE of
# its `severity`, `category`, or `type` fields appears in this list (case
# insensitive).
#
# Typical values you might list (mix and match severities, categories, and
# types — the filter matches any of the three fields):
#
#   severities:  "blocking", "non-blocking"
#   categories:  "security", "correctness", "performance",
#                "reliability", "maintainability"
#   types:       "issue", "suggestion", "question"
#
# Examples:
#
#   # Post everything that clears `min_confidence` (the default):
#   allowed_kinds = []
#
#   # Block-only mode: only `severity = "blocking"` findings:
#   allowed_kinds = ["blocking"]
#
#   # Security-focused: blocking issues OR anything tagged security:
#   allowed_kinds = ["blocking", "security"]
#
# Note: this filter is applied AFTER `min_confidence`. A finding must pass
# both. An empty list (the default) disables the kind filter — useful while
# you are still calibrating which categories the model uses.
allowed_kinds = []

# Review-comment voice ("mood"). Controls ONLY how a posted finding reads — the
# structured fields recorded for audit, and the dedup fingerprint, are
# identical across every tone, so switching tone never re-posts a finding or
# splits its outcome history.
#
#   terse         (default) the structured Impact/Evidence/Fix render —
#                 byte-identical to bubo before this knob existed.
#   collaborative a senior engineer's inline note: acknowledges intent, gives a
#                 concrete example, suggests the fix.
#   socratic      leads with a question that surfaces the gap.
#   formal        measured, complete sentences, no contractions (enterprise).
#   casual        relaxed and brief.
#
# For non-default tones the reviewer is asked for one extra in-voice `comment`
# field, which is posted in place of the structured render (a few extra output
# tokens per finding). Leave as `terse` to keep current behavior exactly.
tone = "terse"

# Surface mode — WHICH findings reach the poster (a precision/recall lever,
# distinct from `tone`, which only changes how a surfaced finding reads).
#
#   collaborate   (default) surface bubo's full typed output — issues AND the
#                 deliberate `suggestion`/`question` collaborative modes, across
#                 every category. Byte-identical to bubo before this knob.
#   gate          high-precision merge lane: surface ONLY blocking-severity
#                 DEFECT findings — type = issue, severity blocking/high/critical,
#                 and a canonical category in correctness / security / concurrency
#                 / resource / error_handling / performance. Drops the
#                 suggestion/question modes and the docs/style/CI-nit categories.
#
# `gate` trades recall for precision, so it is OFF by default — turn it on for a
# CI/merge-blocking bot; leave it `collaborate` for human review. The review
# prompt still emits every finding type regardless of mode; `mode` only filters
# what gets posted. Independent of `allowed_kinds`: if you set both, a finding
# must satisfy both. (The model's free-form category is normalized onto the
# canonical taxonomy for this match; your original label is kept for the comment,
# the dedup fingerprint, and the audit row.)
mode = "collaborate"

# Dispute-driven noise suppression (OFF by default).
#
# Bubo already records, per finding, whether the developer accepted or
# disputed it (the accept/dispute signal in `finding_outcomes`). When this
# is on, the poller stops posting whole `category` classes that a team has
# repeatedly rejected *on this repo* — e.g. if your team keeps dismissing
# "documentation" or "maintainability" nits, bubo learns to drop them here
# rather than re-litigating the same noise every MR.
#
# A category is suppressed when BOTH hold for that repo:
#   * at least `dispute_suppress_min_samples` of its findings have a
#     recorded outcome, AND
#   * the dispute rate (disputed-or-false-positive / total outcomes) is at
#     or above `dispute_suppress_threshold`.
#
# Leave this off unless you have outcome history built up and have seen a
# specific category generate persistent noise. It is a precision lever, not
# a default — start at the per-finding `min_confidence` / `allowed_kinds`
# filters above first.
#
# Conservative by design: this is a lever for teams with accumulated
# accept/dispute history, and it does nothing on a fresh install. Even with
# the flag ON, no category is suppressed until enough outcomes accrue to
# clear `dispute_suppress_min_samples` AND `dispute_suppress_threshold`, so
# enabling it early cannot silence findings off a thin signal — it simply
# stays inert until the data earns a suppression. That is the correct,
# cautious behavior for a noise filter.
#
# Caveat (deliberate): suppression is self-reinforcing. A suppressed
# category stops producing new findings, so its dispute rate is frozen at
# the moment it crossed the threshold and will not recover on its own. The
# escape hatches are this flag and the two tunables below. See
# docs/configuration.md for the full discussion.
suppress_disputed_classes = false

# Dispute rate (0.0-1.0) at or above which a category is suppressed. 0.5 =
# "the team disputed at least half of this category's findings". Only used
# when `suppress_disputed_classes = true`.
dispute_suppress_threshold = 0.5

# Minimum recorded outcomes in a category before its dispute rate is trusted
# enough to act on. Guards against suppressing a class off one or two
# rejections. Only used when `suppress_disputed_classes = true`.
dispute_suppress_min_samples = 5

# Verification before posting (OFF by default).
#
# Before a finding that is otherwise about to be posted is published, bubo
# can run N independent "is this real?" checks and DROP the finding if a
# majority refute it. Each check ("lens") re-asks a verifier to try to
# refute the finding from a different angle and answer with a strict JSON
# verdict; the finding survives only if `verify_min_votes` lenses vote it
# real at or above `verify_confidence_floor`.
#
# HONESTY (read this): with the default `verify_command` (empty → reuses
# `[agents].reviewer_command`), this is the *weaker, correlated* form of
# verification — you are re-asking the SAME model with different prompts, so
# it shares the original finding's blind spots. The strong form from the
# literature (the ~94-98% false-positive reductions) is hybrid static+LLM
# or a GENUINELY DIFFERENT model. For real diversity, set `verify_command`
# to a different model's CLI below. bubo never labels self-refutation as
# hard-proven "verified" — only "not refuted".
#
# COST: this can fan out to up to `verify_max_findings x len(verify_lenses)`
# extra serial LLM calls per change, which is why it is off by default,
# capped, and only ever runs on in-diff, non-duplicate, post-filter
# survivors (the findings actually about to be posted). Findings past the
# cap post UNVERIFIED (and the count is logged — never silently dropped).
# A verifier that times out / errors is treated as "failed to run", so a
# verifier outage can never silently drop every finding.
verify_findings = false

# Lenses to run per finding (each is one extra LLM call). Diverse by design.
verify_lenses = ["correctness", "in_diff", "reproduce"]

# How many lenses must vote a finding real (>= floor) for it to survive.
# 2 of the 3 default lenses = "a majority must confirm".
verify_min_votes = 2

# Minimum verifier self-confidence (0.0-1.0, inclusive) for a real vote to
# count toward survival.
verify_confidence_floor = 0.6

# Cap on findings verified per change. Beyond this, findings post unverified.
verify_max_findings = 5

# Wall-clock budget (seconds) for EACH individual verification check.
verify_timeout_seconds = 300

# Verifier command. Empty reuses `[agents].reviewer_command` (the weaker,
# correlated mode). Point this at a DIFFERENT model for genuine diversity,
# e.g. `verify_command = ["claude", "-p"]`.
verify_command = []


# ----------------------------------------------------------------------------
# [governance] — AI-code provenance capture (opt-in; OFF by default).
# ----------------------------------------------------------------------------
#
# For regulated/enterprise teams whose governance functions must *approve and
# monitor* AI-assisted code. bubo is self-hosted + BYO-LLM, so this data never
# leaves your infrastructure.
#
# This first phase only CAPTURES provenance for audit — it does NOT change
# which findings post, raise severities, or block anything. (Rigor modulation
# and policy gates are a later, separately opt-in phase.)
#
# How it works: bubo already checks out the change before reviewing it, so it
# reads the change's commit trailers and records a *banded* provenance signal
# onto the run — `band` is one of `unknown` / `likely_ai` / `collaborative`.
#
# Two honesty rules are baked in:
#   * It is a confidence BAND, never a binary "AI/human" verdict.
#   * `unknown` is the default — absence of an AI declaration is NOT treated as
#     proof of human authorship. The signal `source` (`trailer` vs, later,
#     `detection`) records declared-vs-detected so an auditor sees which it is.
#     This phase is deterministic (`trailer`) only; post-hoc AI *detection* is
#     deliberately deferred.
#
# Boundary: bubo cannot block a merge — it does not own CI or branch
# protection. It produces auditable data; your pipeline acts on it.
[governance]

# Master switch. When false (default), no commit/diff metadata is fetched and
# nothing is recorded — zero behavior change and zero extra API calls.
capture_provenance = false

# Case-insensitive regexes matched against commit-message lines to detect
# *declared* AI assistance. The built-in defaults (used when this key is
# omitted) match `Generated-by:` / `AI-assisted` style trailers, and
# `Co-authored-by:` ONLY when the value names a known agent (humans co-author
# too). Override to match your org's commit conventions.
# ai_trailer_patterns = [
#   "^\\s*co-authored-by\\s*:.*\\b(claude|copilot|gpt|codex|gemini|cursor)\\b",
#   "^\\s*(assisted|generated)-by\\s*:.*\\b(claude|copilot|gpt|codex|ai)\\b",
#   "^\\s*ai-(assisted|generated)\\b(\\s*[:=].*)?$",
# ]
# Patterns are matched per commit-message line; anchor standalone markers to
# end-of-line (as above) so a prose mention isn't read as a declaration.

# fnmatch globs flagged when a change touches sensitive paths. Recorded on the
# run for audit AND used as the sensitive-path half of the escalation predicate
# below. Empty (default) = off. `*` spans `/`, so `payments/*` and `*.pem` match
# nested files too.
# sensitive_path_globs = ["payments/**", "**/auth/**", "*.pem", "infra/**"]

# --- Phase 2: rigor modulation + policy gates (all advisory, OFF by default) --
#
# These USE the captured provenance. Both are advisory — bubo cannot block a
# merge; it adds review-prompt context and records auditable decisions your
# pipeline can act on. Turning either on auto-implies provenance computation
# even if `capture_provenance = false` (the per-change commit fetch is what all
# three capabilities share).

# When true, a change that ESCALATES injects a heightened-scrutiny directive
# (prioritize the security lens) into that change's review prompt.
# rigor_modulation = false

# Which provenance bands escalate (shared by rigor modulation and the policy
# gate). Default = the two AI-implicated bands; `unknown` never escalates.
# escalate_bands = ["likely_ai", "collaborative"]

# When true (default), a change escalates only if it ALSO touches a
# sensitive_path_globs path; set false to escalate on band alone.
# rigor_require_sensitive = true

# Policy gate: "off" (default) | "report-only" | "soft". When not "off", an
# auditable governance DECISION is recorded per change (queryable for audit).
# All modes are advisory; there is no "enforce" mode because bubo does not own
# CI / branch protection.
# policy_mode = "off"


# ----------------------------------------------------------------------------
# [poller] — Filesystem layout and scheduling hints.
# ----------------------------------------------------------------------------
[poller]

# Runtime state directory, relative to the install root unless absolute.
# Holds the SQLite state file, per-MR worktrees, logs, reports, and rendered
# prompts. Defaults to `var/` under the install root.
state_dir = "var"

# Suggested wait between poll cycles when the operator is using a
# long-running wrapper (rather than cron/systemd). Cron and systemd timers
# should use their own interval; this value mostly feeds helper scripts.
interval_seconds = 900

# Single-MR debug filter. When set, only this IID is reviewed across all
# enabled projects — handy when you want to re-run one specific MR after a
# prompt change. **Leave unset in production** or the poller will ignore
# every other MR.
# target_merge_request_iid = 123


# ----------------------------------------------------------------------------
# [agents] — Review agent CLI configuration.
# ----------------------------------------------------------------------------
[agents]

# Meta prompt rendered before each review. The
# `{{MAX_FINDINGS_PER_REVIEW}}` token in this file is replaced with the
# value of `[review].max_findings_per_merge_request` per review. Override
# only when you have a fork of the prompt and want the agent to use it.
prompt_file = "prompts/00-meta.md"

# Model identifier passed to the review CLI wrapper.
#
# Two things care about this value: (1) the CLI itself (Codex / Claude),
# which must be configured to actually invoke this model, and (2) the
# `model` attribute on OpenTelemetry metrics. If you change the model,
# update the matching pricing rows under `[telemetry]` or the cost-estimate
# metric will be wrong.
llm_model = "gpt-5.5"

# API key for whatever LLM you run the review with (OpenAI, Anthropic,
# Gemini, a local model, …). Exported as the generic `LLM_API_KEY` plus
# the operator-named variable in `llm_api_key_env` below.
#
# Leave blank in the example. **Do not commit real values.**
llm_api_key = ""

# The environment-variable NAME your LLM CLI / SDK reads the key from.
# Bubo is model-agnostic — it does not guess this from the model name —
# so set it to match the LLM you chose:
#
#   OpenAI / Codex     ->  "OPENAI_API_KEY"
#   Anthropic / Claude ->  "ANTHROPIC_API_KEY"
#   Google Gemini      ->  "GEMINI_API_KEY"
#   …whatever your CLI expects.
#
# The key in `llm_api_key` above is exported under this name (and under
# the generic `LLM_API_KEY`). Leave blank if your CLI reads `LLM_API_KEY`
# directly. Default matches the `gpt-5.5` model + Codex above.
llm_api_key_env = "OPENAI_API_KEY"

# Reasoning effort passed to the agent CLI ("low" / "medium" / "high"). Higher
# values produce more thorough reviews but raise latency and cost. Start at
# medium; only raise once you have outcome data justifying it.
reasoning_effort = "medium"

# Dry-run hint exported to the review agent as REVIEW_DRY_RUN. Independent
# from `[review].dry_run`, which controls the poller's own posting behavior.
# Keep both at `true` until you have walked through a review end-to-end.
dry_run = true

# Codex CLI profile used by the default `codex exec` reviewer_command. The
# profile in your Codex config should include the `code-reviewer` Superpowers
# skill and any MCP servers (GitLab, etc.) the prompt expects.
codex_profile = "bubo"

# Filesystem sandbox passed to Codex review runs. `read-only` lets the
# reviewer inspect code without modifying the checkout — the recommended
# default. Loosen only if you understand the implications of an LLM agent
# with write access to your worktree.
#
# CAVEAT: `read-only` makes Codex isolate via bubblewrap. On hosts where
# bubblewrap cannot initialize — unprivileged user namespaces restricted by
# Ubuntu/AppArmor, no setuid `bwrap`, or the review running *nested* inside
# another sandbox — every git/shell tool call the agent needs is rejected
# (`bwrap: loopback: Failed RTM_NEWADDR`). Codex still exits 0, so the run
# looks like a clean "no findings" review even though nothing was reviewed.
# The fix is to set `danger-full-access` for reviewer runs on a dedicated host
# (note: `workspace-write` ALSO uses bubblewrap and fails the same way), or
# install distro bubblewrap (`apt install bubblewrap`) which ships an allowed
# AppArmor profile. See docs/operate.md ("Troubleshooting (host & infra)").
codex_sandbox = "read-only"

# When `true` (the default), the poller posts a single change-level comment
# after a review completes with zero actionable findings, so authors and
# approvers can tell "reviewer ran and was happy" apart from "reviewer
# never ran". Set to `false` to restore the previous silent-on-no-findings
# behavior. Honors `[review].dry_run` — no comment is posted in dry-run.
# Idempotent on exact body match scoped to the bot's author: re-reviews
# of the same MR/PR reuse the existing comment instead of stacking
# duplicates. Comment-post failures are soft — a transient API error
# does NOT flip the review to FAILED.
post_no_findings_comment = true

# Body of the no-findings comment, posted verbatim. Customize for
# localization or branding. Do NOT include per-run values (URLs,
# timestamps, model names) — the body must be byte-identical across
# re-reviews of the same MR/PR for the idempotent dedup to work; a
# per-run-varying body would stack a new comment every poll. An empty
# or whitespace-only value disables posting even when the flag above
# is on.
no_findings_comment_body = "Automated review ran — no issues found."


# ----------------------------------------------------------------------------
# [telemetry] — OpenTelemetry metrics, spans, and cost estimation.
# ----------------------------------------------------------------------------
[telemetry]

# Master switch. When `false`, review state is still written to SQLite but
# no OTel data is exported. Enable once you have an OTLP collector running.
enabled = false

# Logical service name shown in your OTel backend. Use the SAME value
# across all hosts in a fleet so dashboards roll up cleanly.
service_name = "bubo"

# Environment label for dashboards/alerts. Pick from a small set like
# `dev`, `staging`, `prod` — this is a low-cardinality label by design.
environment = "prod"

# OTLP collector endpoint. Ignored when `enabled = false`. The collector
# must accept OTLP/gRPC on this address.
otlp_endpoint = "http://127.0.0.1:4317"

# OTLP transport. Only `grpc` is supported by this package today; the value
# is validated at startup and a mismatch raises a config error.
otlp_protocol = "grpc"

# Metric export interval. Lower values give fresher dashboards but raise
# exporter overhead. 30s is a reasonable default for review-rate metrics.
export_interval_seconds = 30

# Per-finding lifecycle events (planned/posted/skipped/resolved/etc.) emit
# OTel metrics when `true`. Disable only if those events overwhelm your
# backend.
emit_finding_events = true

# Outcome-sync runs emit metrics for resolved/disputed/false-positive/etc.
# when `true`. Disable only if you do not run `--sync-outcomes`.
emit_outcome_sync = true

# Estimated input-token price per ONE MILLION input tokens, in USD. Used
# only for cost metrics; does not affect review execution. Update these
# whenever you switch `llm_model` so the cost dashboard stays meaningful.
input_per_1m = 5.0

# Estimated output-token price per ONE MILLION output tokens, in USD.
output_per_1m = 30.0

# Estimated cached-input price per ONE MILLION cached input tokens, in USD.
# Set this when your model/backend reports cached tokens separately and
# bills them at a different (usually lower) rate.
cached_input_per_1m = 0.5


# ----------------------------------------------------------------------------
# [mcp_server] — How `bubo-mcp` exposes itself.
# ----------------------------------------------------------------------------
#
# `transport = "stdio"` (the default) is correct when the MCP client
# (Codex, Claude Desktop, …) lives on the same host as the reviewer and
# spawns the server per session. No auth — filesystem permissions on
# bin/bubo mcp are the only access control.
#
# `transport = "http"` runs a long-lived HTTP+SSE server bound to
# `host:port`. Every request must carry
# `Authorization: Bearer <bearer_token>`; missing or mismatched returns
# 401. No TLS — terminate TLS at a reverse proxy (nginx, caddy, …) or
# only bind to a localhost/VPN interface.
#
# Either value can be overridden directly via the BUBO_MCP_*
# env vars (useful with systemd `LoadCredential=` for the bearer token).
# ----------------------------------------------------------------------------
[mcp_server]

# "stdio" or "http". stdio = no network, client spawns process per
# session. http = long-lived daemon, bearer-token auth required.
transport = "stdio"

# Bind address for http transport. 127.0.0.1 keeps the server reachable
# only from this host (the safe default). Use 0.0.0.0 (or a specific
# interface) to expose externally, and put TLS in front of it.
host = "127.0.0.1"

# Bind port for http transport. No registered port; pick anything free.
port = 8765

# Static bearer token clients must present in `Authorization: Bearer ...`.
# REQUIRED when transport = "http"; ignored for stdio. Prefer the
# `${VAR}` interpolation form so the literal token never lands on disk —
# pair with systemd `LoadCredential=` or your secret manager. Generate
# with `openssl rand -hex 32` or similar.
# bearer_token = "${BUBO_MCP_TOKEN}"


# ----------------------------------------------------------------------------
# [[projects]] — One block per GitLab repository to review.
# ----------------------------------------------------------------------------
#
# Each project is an array-of-tables entry. Add as many as you want; the
# poller iterates them in order each cycle. Use `enabled = false` to keep a
# project in config (for documentation or rotation) without reviewing it.
# ----------------------------------------------------------------------------

[[projects]]
# GitLab project path in `group/repo` form. Sub-groups are supported:
# `parent-group/sub-group/repo`. The poller URL-encodes the path before
# calling the API, so do not pre-encode it here.
path = "example/enabled-repo"

# Turns polling for this project on or off. `false` skips the project
# entirely while leaving the config row in place.
enabled = true


[[projects]]
# Disabled-project shape, kept here as documentation. The poller will not
# touch this repo until `enabled` flips to `true`.
path = "example/disabled-repo"
enabled = false
