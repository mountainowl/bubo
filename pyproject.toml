[project]
name = "bubo"
version = "0.8.1"
description = "Bubo — agentic AI code review for GitLab MRs and GitHub PRs, with the LLM of your choice."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "mcp>=1.2.0",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
]

[project.scripts]
bubo = "bubo.cli:main"
bubo-poller = "bubo.poller:main"
bubo-codex = "bubo.codex_runner:main"
bubo-gh-poller = "bubo.github:main"
bubo-mcp = "bubo.mcp_server:main"

[dependency-groups]
dev = [
  "commitizen>=4.16.3",
  "hypothesis>=6.155.2",
  "mypy>=1.18.2",
  "pre-commit>=4.5.0",
  "pytest>=9.0.1",
  "ruff>=0.15.16",
]
# Documentation site published to GitHub Pages from docs/ via
# .github/workflows/deploy-docs.yml. Pinned loosely — the docs are
# rendered, not type-checked, so freshness > reproducibility here.
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.7",
]

[tool.uv]
package = true

# Conventional Commits + SemVer driver.
# - `version_provider = "pep621"` makes pyproject.toml the single source of
#   truth for the version; `cz bump` rewrites it in place and tags.
# - `update_changelog_on_bump = false` keeps the curated, hand-written
#   CHANGELOG.md (Keep a Changelog format) authoritative — `cz bump` only
#   touches the version and the tag.
# - `major_version_zero = true` honors SemVer's "anything-goes under 0.x":
#   while the project is pre-1.0, breaking changes bump the MINOR component
#   instead of jumping to 1.0.0 prematurely.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = false
major_version_zero = true
bump_message = "chore(release): $current_version -> $new_version"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "PT009", "PT017", "PT027", "RUF012", "SIM117"]

[tool.pytest.ini_options]
# Integration tests hit a real GitLab instance and are deselected from the
# default run. They self-skip without credentials, but deselecting keeps
# the default `pytest` output free of skip noise. Run them explicitly with
# `uv run pytest -m integration` (the command-line -m overrides this default).
addopts = "-m 'not integration'"
markers = [
    "integration: live, read-only tests against a real GitLab instance; require BUBO_IT_* env vars",
]

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
# Switched from uv_build to hatchling per #22 — hatchling's force-include
# lets us ship the deploy assets (prompts, skills, plugins, deploy templates,
# env.example.toml) at importlib.resources-reachable locations inside the
# wheel WITHOUT physically moving the source files. uv_build's data-dir
# directives are too narrow for this (scripts/data/headers only) and have
# silently dropped the deploy tree in prior releases (#20 bug 3).
#
# uv still manages dependencies, the lockfile, and venv — only the build
# backend changed. Recommended by uv maintainer konstin in astral-sh/uv#11502
# for projects that need flexible non-Python asset packaging.
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

# Hatch is told the package code lives under src/bubo; the
# force-include map below mirrors a curated set of repo-root assets into
# the wheel under bubo/_assets/ so the new `bubo init`
# subcommand can resolve them via importlib.resources.files("bubo._assets")
# regardless of how the package was installed.
[tool.hatch.build.targets.wheel]
packages = ["src/bubo"]

[tool.hatch.build.targets.wheel.force-include]
"deploy/templates/codex-config.toml" = "bubo/_assets/codex-config.toml"
"deploy/templates/claude-settings.json" = "bubo/_assets/claude-settings.json"
"deploy/templates/bubo.cron" = "bubo/_assets/bubo.cron"
"deploy/templates/bubo.service" = "bubo/_assets/bubo.service"
"deploy/templates/bubo.timer" = "bubo/_assets/bubo.timer"
"prompts/00-meta.md" = "bubo/_assets/prompts/00-meta.md"
"skills/code-reviewer/SKILL.md" = "bubo/_assets/skills/code-reviewer/SKILL.md"
"plugins/superpowers/.codex-plugin/plugin.json" = "bubo/_assets/plugins/superpowers/.codex-plugin/plugin.json"
"config/env.example.toml" = "bubo/_assets/env.example.toml"

# Source distribution: ship the runtime assets at the natural repo-root
# paths so a `pip install <sdist>` / `uv build` round-trips correctly
# and `scripts/install-package.sh` (still supported during the
# deprecation window) continues to find them. Hatchling's sdist defaults
# already pick up src/, pyproject.toml, README.md, LICENSE, CHANGELOG.md
# — we explicitly include the rest of the operator-facing tree.
[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "bin/",
  "scripts/",
  "deploy/",
  "prompts/",
  "skills/",
  "plugins/",
  "config/env.example.toml",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
]
