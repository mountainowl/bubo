[project]
name = "llm-reviewer"
version = "0.2.0"
description = "GitLab merge-request code review poller backed by Codex and Claude CLI skills."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "opentelemetry-api>=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
]

[project.scripts]
mr-review-poller = "llm_reviewer.poller:main"
code-review-codex = "llm_reviewer.codex_runner:main"
gh-review-poller = "llm_reviewer.github:main"

[dependency-groups]
dev = [
  "commitizen>=4.16.2",
  "hypothesis>=6.115",
  "mypy>=1.18.2",
  "pre-commit>=4.5.0",
  "pytest>=9.0.1",
  "ruff>=0.14.6",
]

[tool.uv]
package = true

# Conventional Commits + SemVer driver.
# - `version_provider = "pep621"` makes pyproject.toml the single source of
#   truth for the version; `cz bump` rewrites it in place and tags.
# - `update_changelog_on_bump = false` keeps the curated, hand-written
#   CHANGELOG.md (Keep a Changelog format) authoritative — `cz bump` only
#   touches the version and the tag.
# - `major_version_zero = true` honors SemVer's "anything-goes under 0.x":
#   while the project is pre-1.0, breaking changes bump the MINOR component
#   instead of jumping to 1.0.0 prematurely.
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
update_changelog_on_bump = false
major_version_zero = true
bump_message = "chore(release): $current_version -> $new_version"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "PT009", "PT017", "PT027", "RUF012", "SIM117"]

[tool.pytest.ini_options]
# Integration tests hit a real GitLab instance and are deselected from the
# default run. They self-skip without credentials, but deselecting keeps
# the default `pytest` output free of skip noise. Run them explicitly with
# `uv run pytest -m integration` (the command-line -m overrides this default).
addopts = "-m 'not integration'"
markers = [
    "integration: live, read-only tests against a real GitLab instance; require LLM_REVIEWER_IT_* env vars",
]

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
requires = ["uv_build>=0.10.0,<0.12.0"]
build-backend = "uv_build"
